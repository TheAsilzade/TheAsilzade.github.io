<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 875" role="img" aria-labelledby="title desc">
  <title id="title">Sherwood Dungeon Protocol Architecture</title>
  <desc id="desc">A dark protocol diagram showing the launcher, loadBytes client runtime, ASPX bootstrap endpoints, socket server, account store, and local SharedObject save path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080a"/>
      <stop offset="0.52" stop-color="#101217"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2028"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ba"/>
      <stop offset="0.42" stop-color="#d6ad55"/>
      <stop offset="1" stop-color="#7d5a22"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd6ff"/>
      <stop offset="1" stop-color="#4666ff"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3a2"/>
      <stop offset="1" stop-color="#d54c34"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#d6ad55"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7fb8ff"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ff8a72"/>
    </marker>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .label { font-family: Manrope, Segoe UI, Arial, sans-serif; fill: #f7f1e2; font-weight: 800; font-size: 29px; letter-spacing: .3px; }
      .sub { font-family: Manrope, Segoe UI, Arial, sans-serif; fill: #b8b5ac; font-weight: 600; font-size: 17px; }
      .tiny { font-family: Manrope, Segoe UI, Arial, sans-serif; fill: #d9d0ba; font-weight: 700; font-size: 15px; letter-spacing: 1.4px; }
      .mono { font-family: Consolas, Menlo, monospace; fill: #fff4c8; font-size: 16px; font-weight: 700; }
      .box { fill: url(#panel); stroke: rgba(255,255,255,.13); stroke-width: 1.4; rx: 22; filter: url(#shadow); }
      .box-hot { fill: #14100c; stroke: #d6ad55; stroke-opacity: .56; stroke-width: 1.6; rx: 22; filter: url(#shadow); }
      .lineGold { fill: none; stroke: #d6ad55; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); filter: url(#glow); }
      .lineBlue { fill: none; stroke: #7fb8ff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); filter: url(#glow); }
      .lineRed { fill: none; stroke: #ff8a72; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRed); filter: url(#glow); }
      .chip { fill: rgba(255,255,255,.055); stroke: rgba(255,255,255,.11); stroke-width: 1; rx: 14; }
    </style>
  </defs>

  <rect width="1400" height="875" fill="url(#bg)"/>
  <rect width="1400" height="875" fill="url(#grid)"/>
  <circle cx="700" cy="30" r="360" fill="#ffffff" opacity=".045"/>
  <circle cx="1130" cy="185" r="260" fill="#d6ad55" opacity=".055"/>
  <circle cx="230" cy="695" r="300" fill="#7fb8ff" opacity=".045"/>

  <text x="72" y="82" class="tiny">SHERWOOD DUNGEON SERVER</text>
  <text x="72" y="125" class="label" style="font-size:43px">Protocol Runtime Architecture</text>
  <text x="72" y="160" class="sub">ASPX bootstrap, encrypted save/login flow, Flash socket framing, and protected loadBytes client delivery.</text>

  <g transform="translate(72 225)">
    <rect class="box-hot" width="265" height="148"/>
    <circle cx="46" cy="48" r="21" fill="url(#gold)" opacity=".95"/>
    <text x="80" y="54" class="label">Launcher</text>
    <text x="26" y="90" class="sub">package.dlc + MD5 gate</text>
    <text x="26" y="116" class="mono">admin/user build split</text>
  </g>

  <g transform="translate(418 225)">
    <rect class="box" width="265" height="148"/>
    <rect x="27" y="29" width="44" height="44" rx="10" fill="url(#blue)" opacity=".95"/>
    <text x="88" y="54" class="label">LoadBytes</text>
    <text x="26" y="90" class="sub">SWF-to-SWF execution</text>
    <text x="26" y="116" class="mono">runtime-only client</text>
  </g>

  <g transform="translate(768 225)">
    <rect class="box-hot" width="288" height="148"/>
    <path d="M42 30 L70 52 L42 74 L14 52 Z" fill="url(#gold)" opacity=".95"/>
    <text x="92" y="54" class="label">Client Runtime</text>
    <text x="26" y="90" class="sub">AS3 patches + assets</text>
    <text x="26" y="116" class="mono">commands, pets, shaders</text>
  </g>

  <g transform="translate(1120 225)">
    <rect class="box" width="210" height="148"/>
    <circle cx="48" cy="52" r="25" fill="url(#red)" opacity=".92"/>
    <text x="90" y="54" class="label">Local Save</text>
    <text x="26" y="91" class="sub">SharedObject</text>
    <text x="26" y="116" class="mono">_mmSWD.sol</text>
  </g>

  <path class="lineGold" d="M337 299 C365 299 386 299 418 299"/>
  <path class="lineBlue" d="M683 299 C716 299 734 299 768 299"/>
  <path class="lineRed" d="M1056 299 C1080 299 1096 299 1120 299"/>

  <g transform="translate(92 518)">
    <rect class="box" width="310" height="178"/>
    <text x="28" y="48" class="label">HTTP ASPX</text>
    <text x="28" y="82" class="sub">bootstrap, login, save</text>
    <rect class="chip" x="26" y="105" width="75" height="34"/><text x="43" y="128" class="mono">SCVI</text>
    <rect class="chip" x="111" y="105" width="63" height="34"/><text x="128" y="128" class="mono">SCI</text>
    <rect class="chip" x="184" y="105" width="63" height="34"/><text x="201" y="128" class="mono">SCL</text>
    <rect class="chip" x="257" y="105" width="63" height="34"/><text x="274" y="128" class="mono">SCS</text>
    <text x="28" y="159" class="sub">encrypted envelopes + session keys</text>
  </g>

  <g transform="translate(545 520)">
    <rect class="box-hot" width="310" height="176"/>
    <text x="28" y="48" class="label">Socket :1634</text>
    <text x="28" y="82" class="sub">Flash packet framing + AMF body</text>
    <rect class="chip" x="26" y="105" width="83" height="34"/><text x="42" y="128" class="mono">Logon</text>
    <rect class="chip" x="119" y="105" width="54" height="34"/><text x="136" y="128" class="mono">JR</text>
    <rect class="chip" x="183" y="105" width="54" height="34"/><text x="198" y="128" class="mono">MP</text>
    <rect class="chip" x="247" y="105" width="54" height="34"/><text x="263" y="128" class="mono">SA</text>
    <text x="28" y="159" class="sub">rooms, movement, chat, validation</text>
  </g>

  <g transform="translate(1000 520)">
    <rect class="box" width="310" height="176"/>
    <text x="28" y="48" class="label">Account Store</text>
    <text x="28" y="82" class="sub">member saves + premium state</text>
    <rect class="chip" x="26" y="105" width="86" height="34"/><text x="43" y="128" class="mono">JSON</text>
    <rect class="chip" x="123" y="105" width="86" height="34"/><text x="142" y="128" class="mono">Pets</text>
    <rect class="chip" x="220" y="105" width="72" height="34"/><text x="238" y="128" class="mono">Logs</text>
    <text x="28" y="159" class="sub">persistent data + diagnostics</text>
  </g>

  <path class="lineGold" d="M912 373 C874 438 690 470 392 518"/>
  <path class="lineBlue" d="M912 373 C892 443 810 486 730 520"/>
  <path class="lineGold" d="M402 606 C449 606 496 606 545 606"/>
  <path class="lineBlue" d="M855 606 C902 606 950 606 1000 606"/>
  <path class="lineRed" d="M1156 520 C1128 455 1088 399 1041 373"/>

  <g transform="translate(406 752)">
    <rect x="0" y="0" width="588" height="60" rx="18" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.12)"/>
    <text x="28" y="38" class="sub">Runtime loop: client patching -> ASPX authority -> socket world state -> persisted account/save data.</text>
  </g>
</svg>
